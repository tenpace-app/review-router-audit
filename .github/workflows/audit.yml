name: Review health

on:
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * 1"

permissions:
  contents: read
  pull-requests: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: tenpace-app/review-router-audit@v1
        id: audit
      - uses: actions/upload-artifact@v7
        with:
          name: review-router-audit
          path: ${{ steps.audit.outputs.report-path }}
